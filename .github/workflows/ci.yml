name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: agentgrid }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentgrid
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway CI secrets
        run: |
          echo "MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Prisma schema & migrations
        run: npx prisma validate && npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Conversation evals (quality gate)
        run: npm run eval
      - run: npm run build
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
